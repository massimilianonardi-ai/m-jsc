name: jsc source release and integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m
          ref: 47e6055f8ccdccee6906ec1de387b17124e56527
          path: m-source
          persist-credentials: false
      - name: Real package-local integration and compiler behavior
        shell: sh
        run: sh tests/run.sh m-source
      - name: Shell and Node syntax checks
        shell: sh
        run: |
          sh -n build.sh tests/run.sh bin/jsc tests/fixtures/pkg/jsc/all/n0001=v0.1.0/cmd/jsc
          node --check lib/jsc.lib.js

  release:
    needs: [validation]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble and verify release asset
        shell: sh
        run: |
          sh build.sh release
          cd release
          sha256sum jsc-v0.1.0-all.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
          tar -tzf jsc-v0.1.0-all.tar.gz | grep -q '^bin/jsc$'
          tar -tzf jsc-v0.1.0-all.tar.gz | grep -q '^lib/jsc.lib.js$'
          tar -tzf jsc-v0.1.0-all.tar.gz | grep -q '^res/manual/jsc$'
          tar -tzf jsc-v0.1.0-all.tar.gz | grep -q '^res/manual/jsc.lib.js$'
      - name: Publish immutable v0.1.0 if absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: sh
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1
          then
            echo 'v0.1.0 already exists; refusing to replace immutable asset'
            exit 0
          fi
          gh release create v0.1.0 release/jsc-v0.1.0-all.tar.gz release/SHA256SUMS \
            --target "$GITHUB_SHA" --title 'jsc v0.1.0' \
            --notes 'Package-local jsc compiler for managed Node.js; package definition owned by pkg-catalog.'
